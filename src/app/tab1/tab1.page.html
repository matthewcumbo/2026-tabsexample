<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-list>
    <ion-list-header>{{header}}</ion-list-header>
    <ion-item>
      <ion-label>
        <h1>{{countries[0].country}}</h1>
        <p>{{countries[0].capital}}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h1>{{countries[1].country}}</h1>
        <p>{{countries[1].capital}}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h1>{{countries[2].country}}</h1>
        <p>{{countries[2].capital}}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h1>{{countries[3].country}}</h1>
        <p>{{countries[3].capital}}</p>
      </ion-label>
    </ion-item>
  </ion-list>


</ion-content>
