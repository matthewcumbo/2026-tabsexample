<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Services</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Services</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-title>{{student.name}} {{student.surname}}</ion-card-title>
    <ion-card-subtitle>{{student.age}}</ion-card-subtitle>
  </ion-card>
  
</ion-content>
